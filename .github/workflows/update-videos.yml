name: Update TV videos

on:
  schedule:
    # 20:00 Asia/Shanghai = 12:00 UTC, every day.
    - cron: "0 12 * * *"
    # 14:00 Asia/Shanghai = 06:00 UTC, Monday and Tuesday.
    - cron: "0 6 * * 1,2"
  workflow_dispatch:
    inputs:
      show:
        description: "Optional configured show name"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v5

      - name: Checkout tv2html repository
        uses: actions/checkout@v5
        with:
          repository: zye9312/tv2html
          path: tv2html
          ref: main
          token: ${{ secrets.TV2HTML_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install tv2html dependencies
        run: python -m pip install -r tv2html/requirements.txt

      - name: Choose show for schedule
        id: show
        env:
          MANUAL_SHOW: ${{ inputs.show }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_SHOW" ]; then
            echo "name=$MANUAL_SHOW" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_SCHEDULE" = "0 12 * * *" ]; then
            echo "name=兰香如故" >> "$GITHUB_OUTPUT"
          else
            echo "name=心动的信号第9季" >> "$GITHUB_OUTPUT"
          fi

      - name: Update and validate pages
        env:
          TV2HTML_DIR: ${{ github.workspace }}/tv2html
        run: bash scripts/update_videos.sh --show "${{ steps.show.outputs.name }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html videos
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ${{ steps.show.outputs.name }} episodes"
            git push
          fi
